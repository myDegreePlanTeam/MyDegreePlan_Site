# Builds and deploys the landing page to GitHub Pages.
#
# Triggers:
#   * repository_dispatch "release-published"  sent by the Deploy repo's Release workflow
#   * push to main                             copy/design changes
#   * daily cron                               safety net if a dispatch was missed
#   * manual
#
# Setup (once): repo Settings -> Pages -> Source: GitHub Actions.
name: Site

on:
  repository_dispatch:
    types: [release-published]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refresh release data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run releases
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
